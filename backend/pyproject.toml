[project]
name = "scrapchef"
version = "0.1.0"
description = "Mini-ScrapChef: scrap-mix optimiser demo for EAF steelmaking"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.1",
  "pandas>=2.2",
  "numpy>=2.0",
  "scipy>=1.13",
  "scikit-learn>=1.5",
  "cvxpy>=1.5",
  "pydantic>=2.8",
  "pyyaml>=6.0",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "sqlmodel>=0.0.22",
  "anthropic>=0.40",
]

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scrapchef"]

[tool.pytest.ini_options]
testpaths = ["tests"]
